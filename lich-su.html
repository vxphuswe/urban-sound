<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử & yêu thích – Urban Sound</title>
  <meta name="description" content="Xem lại các lần nhận diện, đánh dấu yêu thích để không bị xóa.">
  <meta name="theme-color" content="#0a0e0d">
  <meta property="og:title" content="Lịch sử & yêu thích – Urban Sound">
  <meta property="og:description" content="Xem lại các lần nhận diện, đánh dấu yêu thích để không bị xóa.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('tp.theme')||'dark'}catch(e){}</script>
</head>
<body class="page-history">
  <a class="sr-only" href="#main">Bỏ qua điều hướng</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-head container">
      <span class="eyebrow">Lịch sử & yêu thích</span>
      <h1>Những gì bạn đã nghe</h1>
      <p>Đánh dấu <b>yêu thích</b> để giữ lại kết quả quan trọng – mục yêu thích không bị xóa khi bạn dọn lịch sử.</p>
    </section>

    <div class="narrow stack">
      <div class="notice" id="login-hint" hidden>
        <span data-icon="user"></span>
        <div><b>Lịch sử đang lưu trên trình duyệt này.</b> <a class="link" href="dang-nhap.html?next=lich-su.html">Đăng nhập</a> để xem lại trên điện thoại và máy tính khác.</div>
      </div>

      <div class="row" style="justify-content:space-between">
        <div class="seg" role="tablist">
          <button role="tab" aria-selected="true" data-tab="all" id="t-all"><span data-icon="history" data-size="16"></span>Tất cả <span class="badge" id="c-all">0</span></button>
          <button role="tab" aria-selected="false" data-tab="fav" id="t-fav"><span data-icon="star" data-size="16"></span>Yêu thích <span class="badge" id="c-fav">0</span></button>
        </div>
        <div class="row" style="gap:8px">
          <select class="select" id="f-src" aria-label="Lọc theo nguồn">
            <option value="">Mọi nguồn</option><option value="file">File âm thanh</option><option value="video">Video</option><option value="mic">Ghi âm</option><option value="live">Giám sát trực tiếp</option>
          </select>
          <button class="btn btn-sm" id="export" type="button"><span data-icon="download" data-size="16"></span>CSV</button>
          <button class="btn btn-sm btn-danger" id="clear" type="button"><span data-icon="trash" data-size="16"></span>Xóa lịch sử</button>
        </div>
      </div>

      <input class="input" id="q" type="search" placeholder="Tìm theo tên âm thanh, tên file, lời nói…" aria-label="Tìm kiếm" style="height:46px">
      <div class="hist" id="list"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="assets/js/pages/history.js"></script>
</body>
</html>
